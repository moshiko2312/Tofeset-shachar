<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="משחק התופסת של שכב״ג שחר">
<title>משחק התופסת · שכב״ג שחר</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="config.js?v=2"></script>
<script>try{if(localStorage.getItem('tofeset.theme')=='"light"'){document.documentElement.classList.add('light');}}catch(e){}</script>
<style>
:root{
  --bg:#000;--bg-top:#141414;--bg-mid:#050505;--card-a:#151515;--card-b:#0c0c0c;--surface:#0a0a0a;--line:#262626;--btn:#1a1a1a;
  --text:#F4F4F4;--text2:#d4d4d4;--muted:#9b9b9b;--dim:#5e5e5e;--nav:rgba(0,0,0,.92);--shadow:rgba(0,0,0,.55);
  --gold:#D4AF37;--gold-hi:#F6DE8D;--gold-lo:#A8832A;
  --grad-gold:linear-gradient(135deg,#FFEAA6 0%,#E3B94B 45%,#B4861C 100%);
  --grad-text:var(--grad-gold);
  --ok:#62d494;--warn:#ffb648;--danger:#ff6b6b;
  --danger-bg:#1d0b0b;--danger-line:#5b2020;--danger-text:#ff9a9a;
  --warn-bg:#1c1406;--warn-line:#5a4416;--warn-text:#ffd78a;
  --ok-bg:#0a1a10;--ok-line:#1f5a36;--ok-text:#9ef0bf;
  --r:18px;color-scheme:dark;
}
html.light{
  --bg:#F6F5F1;--bg-top:#FFFFFF;--bg-mid:#FAF9F6;--card-a:#FFFFFF;--card-b:#FCFBF8;--surface:#F3F1EB;--line:#E3DED2;--btn:#FFFFFF;
  --text:#161616;--text2:#3b3b3b;--muted:#6d6d6d;--dim:#a8a8a8;--nav:rgba(255,255,255,.95);--shadow:rgba(70,55,20,.10);
  --gold:#B8901F;--gold-hi:#8A6810;--gold-lo:#76570C;
  --grad-gold:linear-gradient(135deg,#F5DA84 0%,#E2B748 45%,#C39420 100%);
  --grad-text:linear-gradient(135deg,#C99C24 0%,#A47B16 50%,#7A5A0E 100%);
  --ok:#1c8f52;--warn:#a86500;--danger:#c62828;
  --danger-bg:#fdeeee;--danger-line:#f0c4c4;--danger-text:#b42323;
  --warn-bg:#fff6e3;--warn-line:#efd7a3;--warn-text:#835400;
  --ok-bg:#eaf8f0;--ok-line:#b9e5ca;--ok-text:#1b7343;
  color-scheme:light;
}
html.light #modal-root .backdrop{background:rgba(30,25,10,.38)}
html.light .card{box-shadow:0 8px 24px var(--shadow)}
html.light nav.tabs a .i{filter:grayscale(1)}
html.light nav.tabs a.on .i{filter:none}
html.light .skeleton{background:linear-gradient(90deg,#efede7,#f8f7f3,#efede7);background-size:200% 100%}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.45}
body{min-height:100vh;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 320px,var(--bg) 100%) #000}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}

/* header */
#hdr{display:flex;align-items:center;gap:10px;padding:6px 2px 16px}
#hdr .logo{width:50px;height:50px;flex:none;filter:drop-shadow(0 4px 14px rgba(212,175,55,.25))}
.brand{flex:1;min-width:0}
.tribe{font-weight:900;font-size:24px;white-space:nowrap;letter-spacing:.3px;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.title{color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-side{text-align:left;flex:none}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.reg{color:var(--gold-hi);border-color:rgba(212,175,55,.45)}
.chip.live{color:var(--ok);border-color:rgba(98,212,148,.45)}
.chip.live::first-letter{animation:blink 1.4s infinite}
.chip.end{color:var(--gold-hi);border-color:rgba(212,175,55,.45)}
.count{font-size:12px;color:var(--muted)}
.status-line{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;row-gap:3px}
@keyframes blink{50%{opacity:.25}}

.demo-bar{font-size:12.5px;color:var(--gold-hi);border:1px dashed rgba(212,175,55,.45);border-radius:12px;padding:8px 12px;margin-bottom:14px;background:var(--surface)}

/* cards */
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid rgba(212,175,55,.16);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 12px 30px var(--shadow)}
.card h1,.card h2,.card h3{margin:0 0 8px;line-height:1.2}
.card h1{font-size:28px;font-weight:900}
.card h2{font-size:21px;font-weight:700}
.card h3{font-size:16px;font-weight:700;color:var(--gold-hi)}
.card p{margin:6px 0}
.center{text-align:center}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.gold{color:var(--gold-hi)}
.gold-text{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.big-emoji{font-size:44px;line-height:1;margin-bottom:6px}
.welcome-logo{width:120px;height:120px;margin:4px auto 10px;filter:drop-shadow(0 8px 28px rgba(212,175,55,.3))}

/* forms */
textarea{display:block;width:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:150px;outline:none;resize:vertical;line-height:1.6}
textarea:focus{border-color:var(--gold)}
.tag{display:inline-block;font-size:11.5px;font-weight:500;border-radius:99px;padding:1px 8px;margin-inline-start:6px;border:1px solid rgba(212,175,55,.5);color:var(--gold-hi);vertical-align:middle;white-space:nowrap}
.tag.red{border-color:var(--danger-line);color:var(--danger-text)}
.num img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.num i{font-style:normal}
.num.has-av i{position:absolute;bottom:-5px;left:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--bg);border:1.5px solid var(--gold);font-size:11px;display:grid;place-items:center;padding:0 4px;color:var(--gold-hi);line-height:1}
.node.out .num img{filter:grayscale(1) brightness(.55)}
.av{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold);background:var(--surface);color:var(--gold-hi);font-weight:700;font-size:15px;vertical-align:middle;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:110px;height:110px;font-size:40px;border-width:3px;box-shadow:0 8px 26px rgba(212,175,55,.25)}
.av.md{width:52px;height:52px;font-size:20px;border-width:2px}
.me-av{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px;font:inherit;color:inherit;text-align:right}
.target-av{margin:12px auto 0}
.prof-av{width:132px;height:132px;margin:6px auto 10px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);display:grid;place-items:center;background:var(--surface);font-size:52px;font-weight:900;color:var(--gold-hi);box-shadow:0 10px 30px rgba(212,175,55,.25)}
.prof-av img{width:100%;height:100%;object-fit:cover}
details.pin-box{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
details.pin-box summary{cursor:pointer;font-weight:700}
.podium .av{margin:4px auto}
.node .nm{font-size:18px}
.node .sub{font-size:16px;color:var(--text2);margin-top:2px}
.node .sub b{color:var(--gold-hi);font-weight:700;font-size:17px}
.live-link{float:left;font-size:14px;font-weight:500;color:var(--gold-hi);text-decoration:none;border:1px solid rgba(212,175,55,.45);border-radius:99px;padding:3px 10px}
.live-top{display:flex;gap:12px;margin-bottom:14px}
.live-stat{flex:1;text-align:center;background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid rgba(212,175,55,.25);border-radius:18px;padding:14px 6px}
.live-stat .n{font-size:clamp(36px,8vw,76px);font-weight:900;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.live-stat .l{color:var(--muted);font-size:clamp(13px,2vw,20px)}
.live-grid{display:grid;gap:14px;grid-template-columns:1fr}
.live-grid .card{margin:0}
.pairs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pair{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:clamp(16px,1.5vw,22px)}
.pair .arrow{color:var(--gold);font-weight:900}
.live-feed li{font-size:clamp(16px,1.5vw,22px)}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:clamp(16px,1.5vw,22px)}
.lb-row:last-child{border-bottom:none}
.lb-row .c{margin-inline-start:auto;color:var(--gold-hi);font-weight:900}
.live-flash{position:sticky;top:8px;z-index:5;text-align:center;font-size:clamp(20px,4vw,42px);padding:16px;border-radius:18px;background:var(--grad-gold);color:#111;margin-bottom:14px;animation:pop .5s ease-out;box-shadow:0 10px 30px var(--shadow)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.live-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px}
body.is-live nav.tabs{display:none}
body.is-live .wrap{padding-bottom:30px}
@media(min-width:900px){body.is-live .wrap{max-width:1300px}.live-grid{grid-template-columns:1fr 1fr}.live-pairs{grid-column:1 / -1}}
.ro-handle{font-size:24px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 8px;color:var(--gold-hi);flex:none}
.ro-row{border-radius:12px}
.ro-row.dragging{background:var(--surface);box-shadow:0 10px 26px var(--shadow);outline:1.5px solid var(--gold);position:relative;z-index:2}
.ro-list .num{width:34px;height:34px;font-size:13px;border-width:1.5px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.list-head h3{margin:0}
.list-head .btn{width:auto;margin:0;padding:6px 12px;min-height:36px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gitem{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gitem img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in;background:#000}
.gitem .cap{padding:8px 10px;font-size:14px;line-height:1.35}
.gitem .cap b{color:var(--gold-hi)}
.gitem .t{color:var(--muted);font-size:12px}
.gitem .del{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer}
.self-card{text-align:center;border-color:var(--line)}
.self-card .btn{margin-top:8px}
.link-btn{display:block;margin:10px auto 0;background:none;border:none;color:var(--gold-hi);text-decoration:underline;font-size:14.5px;cursor:pointer}
.name-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:52vh;overflow:auto;padding:2px}
.name-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:16.5px;font-weight:500;cursor:pointer;color:var(--text)}
.name-btn .av{width:26px;height:26px;font-size:12px;border-width:1px}
.name-btn:active{border-color:var(--gold)}
.picked{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.picked b{font-size:19px;flex:1}
label{display:block;font-size:14px;color:var(--text2);margin:0 0 12px;font-weight:500}
input,select{display:block;width:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:18px;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--gold)}
input.pin{letter-spacing:10px;text-align:center;font-weight:700;direction:ltr}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:18px 52%,12px 52%;background-size:6px 6px;background-repeat:no-repeat}
.row2{display:flex;gap:10px}.row2>*{flex:1}

/* buttons */
.btn{display:block;width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--btn);color:var(--text);font-weight:700;font-size:17px;cursor:pointer;padding:10px 14px;margin-top:10px;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.gold{background:var(--grad-gold);color:#111;border:none;box-shadow:0 8px 22px rgba(212,175,55,.22)}
.btn.xl{min-height:60px;font-size:20px;font-weight:900}
.btn.ghost{background:transparent;color:var(--text2)}
.btn.small{min-height:40px;font-size:14.5px;font-weight:500}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-text)}
.btn-row{display:flex;gap:10px}.btn-row .btn{flex:1}
.btn-col .btn{margin-top:10px}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px;font-size:14px}
.busy{position:relative;color:transparent!important}
.busy::after{content:'';position:absolute;inset:0;margin:auto;width:20px;height:20px;border-radius:50%;border:3px solid rgba(0,0,0,.25);border-top-color:#111;animation:spin .7s linear infinite}
.btn:not(.gold).busy::after{border-color:var(--line);border-top-color:var(--text)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:11px 6px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--grad-gold);color:#111}

/* me */
.hello{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:18px}
.target{text-align:center;padding:22px 18px}
.label{font-size:13px;letter-spacing:.5px;color:var(--gold);font-weight:700}
.target-name{font-size:42px;font-weight:900;line-height:1.1;margin:8px 0 6px;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
.tie-hint{margin-top:12px;font-size:13.5px;color:var(--text2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.notice{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14.5px;text-align:right}
.notice.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text)}
.notice.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-text)}
.pending{display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.incoming{border:1.5px solid var(--gold);animation:pulse 1.8s ease-in-out infinite;text-align:center}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.35)}50%{box-shadow:0 0 0 10px rgba(212,175,55,0)}}
img.proof{display:block;width:100%;max-height:52vh;object-fit:contain;background:var(--bg);border-radius:14px;border:1px solid var(--line);margin:12px 0;cursor:zoom-in}
.out{text-align:center;border-color:var(--line)}
.stats-row{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card-b);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat .n{font-size:26px;font-weight:900;color:var(--gold-hi);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.hunter{font-size:16px}
.winner{text-align:center;border-color:var(--gold);background:radial-gradient(90% 70% at 50% 0%,var(--card-a),var(--surface))}
.crown{font-size:56px;line-height:1;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.winner-name{font-size:38px;font-weight:900;background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}

/* chain */
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{margin:0;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:6px;flex:none}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 12px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chips button.on{border-color:var(--gold);color:var(--gold-hi)}
ul.chain{list-style:none;margin:0;padding:0;position:relative}
ul.chain::before{content:'';position:absolute;right:21px;top:22px;bottom:22px;width:2px;background:linear-gradient(var(--gold),rgba(212,175,55,.15))}
.node{display:flex;align-items:center;gap:12px;padding:7px 0;position:relative}
.num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--gold);font-weight:700;color:var(--gold-hi);flex:none;position:relative;z-index:1;font-size:15px}
.who{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.nm{font-weight:700;font-size:16.5px}
.sub{font-size:13.5px;color:var(--muted);margin-top:1px}
.sub b{color:var(--text2);font-weight:500}
.node.out .num{border-color:var(--line);color:var(--dim);background:var(--surface)}
.node.out .nm{color:var(--dim);text-decoration:line-through}
.node.out .who{background:var(--surface);border-color:var(--line)}
.node.me .num{background:var(--grad-gold);color:#111;border-color:transparent}
.node.me .who{border-color:rgba(212,175,55,.55)}
.you{font-size:12px;color:var(--gold);font-weight:500}
.badge{font-size:13px;background:var(--surface);border:1px solid rgba(212,175,55,.35);color:var(--gold-hi);border-radius:99px;padding:3px 9px;flex:none}
.loop{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.podium{display:flex;gap:8px;align-items:flex-end}
.podium>div{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.podium .p1{border-color:rgba(212,175,55,.6);padding-top:16px}
.podium .m{font-size:26px}
.podium .pn{font-weight:700;font-size:14.5px;word-break:break-word}
.podium .pc{font-size:12.5px;color:var(--muted)}
ul.feed{list-style:none;margin:0;padding:0}
ul.feed li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
ul.feed li:last-child{border-bottom:none}
ul.feed .t{color:var(--muted);font-size:12.5px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:16px 0}

/* rules */
ol.rules{margin:0;padding:0 22px 0 0}
ol.rules li{margin:0 0 12px;font-size:16px}
ol.rules li::marker{color:var(--gold);font-weight:900}
.tie-rule{display:flex;gap:14px;align-items:center;border-color:var(--gold)}
.tie-rule .ico{font-size:46px;flex:none}

/* admin */
.alist{list-style:none;margin:0;padding:0}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow .num{width:34px;height:34px;font-size:13px;border-width:1.5px}
.arow .who{background:none;border:none;padding:0}
.acts{display:flex;gap:6px;flex:none}
.acts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font-size:13px;cursor:pointer;color:var(--text2)}
.acts button.danger{color:var(--danger-text);border-color:var(--danger-line)}
.acts button.ok{color:#111;background:var(--grad-gold);border:none;font-weight:700}
.st{font-size:12px;border-radius:99px;padding:2px 8px;border:1px solid var(--line);white-space:nowrap}
.st.pending{color:var(--warn);border-color:var(--warn-line)}
.st.confirmed{color:var(--ok);border-color:var(--ok-line)}
.st.rejected{color:var(--danger-text);border-color:var(--danger-line)}
.st.cancelled{color:var(--dim)}
.share{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;direction:ltr;font-size:13.5px;word-break:break-all;color:var(--text2)}
a.btn{text-align:center;text-decoration:none;line-height:30px}
details.card summary{cursor:pointer;font-weight:700;color:var(--gold-hi);list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:' ▾';color:var(--muted)}
details[open].card summary{margin-bottom:12px}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(212,175,55,.22);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500;padding:6px 0 4px;border-radius:12px}
nav.tabs a .i{display:block;font-size:22px;line-height:1.2;filter:grayscale(1) brightness(1.4);opacity:.7}
nav.tabs a.on{color:var(--gold-hi)}
nav.tabs a.on .i{filter:none;opacity:1}
.foot{text-align:center;margin-top:18px}

/* modal + toast */
#modal-root .backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#modal-root .sheet{width:100%;max-width:560px;background:linear-gradient(180deg,var(--card-a),var(--surface));border-top:1px solid rgba(212,175,55,.4);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .2s ease-out}
#modal-root h3{margin:0 0 8px;font-size:20px}
#modal-root img.zoom{width:100%;border-radius:14px;display:block}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--line);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);width:max-content;transition:.25s;pointer-events:none;box-shadow:0 10px 30px var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--danger-line);color:var(--danger-text)}
#toast.ok{border-color:rgba(212,175,55,.6);color:var(--gold-hi)}
.skeleton{height:160px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--card-a),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <div id="demo"></div>
  <main id="view"><div class="skeleton"></div></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="avfile" accept="image/*" hidden>
<input type="file" id="camg" accept="image/*" hidden>
<input type="file" id="selfpic" accept="image/*" hidden>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- logo */
const LOGO = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="שכב״ג שחר" width="100%" height="100%">
<defs>
 <linearGradient id="lgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEAA6"/><stop offset=".55" stop-color="#E3B94B"/><stop offset="1" stop-color="#B4861C"/></linearGradient>
 <linearGradient id="lgR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAA6"/><stop offset=".45" stop-color="#C9971C"/><stop offset="1" stop-color="#FFE29A"/></linearGradient>
 <radialGradient id="lgS" cx="60" cy="72" r="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F6D57A" stop-opacity=".55"/><stop offset=".55" stop-color="#E3B94B" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="lgC"><circle cx="60" cy="60" r="50"/></clipPath>
</defs>
<circle cx="60" cy="60" r="56.5" fill="#000" stroke="url(#lgR)" stroke-width="3"/>
<circle cx="60" cy="60" r="50.5" fill="none" stroke="url(#lgR)" stroke-width="1" opacity=".55"/>
<g clip-path="url(#lgC)">
 <circle cx="60" cy="72" r="46" fill="url(#lgS)"/>
 <path d="M86.6 67.3L99.4 65.1M83.4 58.5L90.3 54.5M77.4 51.3L85.7 41.4M69.2 46.6L72 39.1M60 45L60 32M50.8 46.6L48 39.1M42.6 51.3L34.3 41.4M36.6 58.5L29.7 54.5M33.4 67.3L20.6 65.1" stroke="url(#lgG)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
 <path d="M38 72A22 22 0 0 1 82 72Z" fill="url(#lgG)"/>
 <rect x="0" y="72" width="120" height="48" fill="#000"/>
 <path d="M16 72H104" stroke="url(#lgG)" stroke-width="2.6" stroke-linecap="round"/>
 <path d="M37 80H83" stroke="url(#lgG)" stroke-width="2.3" stroke-linecap="round" opacity=".8"/>
 <path d="M46 87.5H74" stroke="url(#lgG)" stroke-width="2.1" stroke-linecap="round" opacity=".55"/>
 <path d="M54 95H66" stroke="url(#lgG)" stroke-width="2" stroke-linecap="round" opacity=".35"/>
</g>
<path d="M88 24l1.7 4.6 4.6 1.7-4.6 1.7L88 36.6l-1.7-4.6-4.6-1.7 4.6-1.7z" fill="#FFEAA6"/>
</svg>`;

/* ---------------------------------------------------------------- utils */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const sstore = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
};
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 50) return 'עכשיו';
  if (s < 3600) return `לפני ${Math.round(s / 60)} דק׳`;
  if (s < 86400) return `לפני ${Math.round(s / 3600)} שע׳`;
  const d = new Date(iso);
  return d.toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric' }) + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}
const isImg = s => typeof s === 'string' && s.startsWith('data:image/');
let toastT;
function toast(msg, type = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3400);
}

/* ---------------------------------------------------------------- backend */
const CFG = window.TOFESET_CONFIG || {};
const LIVE = !!(CFG.supabaseUrl && CFG.supabaseKey);

async function rpc(fn, args = {}) {
  if (!LIVE) { await sleep(90); return demo.call(fn, args); }
  const headers = { 'Content-Type': 'application/json', apikey: CFG.supabaseKey };
  if (/^eyJ/.test(CFG.supabaseKey)) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  try {
    const r = await fetch(CFG.supabaseUrl.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn,
      { method: 'POST', headers, body: JSON.stringify(args) });
    const j = await r.json().catch(() => null);
    if (!r.ok) return { error: (j && (j.message || j.hint)) || ('שגיאת שרת ' + r.status) };
    return j || {};
  } catch (e) {
    return { error: 'אין חיבור לאינטרנט. נסה שוב', network: true };
  }
}

/* Demo mode: the same game rules as the database, kept in this browser only. */
const demo = (() => {
  const KEY = 'tofeset.demo.v2';
  const ROSTER = Array.isArray(CFG.demoRoster) && CFG.demoRoster.length ? CFG.demoRoster
    : ['נועם', 'מאיה', 'איתי', 'שירה', 'יונתן', 'תמר', 'עומר', 'נועה', 'אורי', 'ליה', 'רועי', 'הילה'];
  let db = null;
  const now = () => new Date().toISOString();
  const err = m => ({ error: m });
  const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
  const P = id => db.players.find(p => p.id === Number(id));
  const alive = () => db.players.filter(p => p.alive).sort((a, b) => a.position - b.position);
  const hunterOf = id => { const me = P(id); const al = alive().filter(p => p.id !== me.id); if (!al.length) return null; return ([...al].reverse().find(p => p.position < me.position) || al[al.length - 1]).id; };
  const targetOf = id => { const me = P(id); const al = alive().filter(p => p.id !== me.id); if (!al.length) return null; return (al.find(p => p.position > me.position) || al[0]).id; };
  const accessOk = c => !(db.game.join_code || '').trim() || norm(c) === db.game.join_code.trim();
  const pinErr = (id, pin) => { const p = P(id); if (!p) return 'השחקן לא נמצא'; if (p.pin == null) return 'עוד לא נכנסת בפעם הראשונה. בחר את השם שלך וקוד חדש'; return p.pin === String(pin) ? null : 'קוד שגוי'; };
  const modErr = (id, pin) => { const e = pinErr(id, pin); if (e) return e; const p = P(id); return p.is_manager && !p.blocked ? null : 'אין לך הרשאת מנהל'; };
  const admErr = c => c === db.game.admin ? null : 'קוד מדריך שגוי';
  const staff = (n, pw) => { const m = (db.managers || []).find(x => x.name.toLowerCase() === norm(n).toLowerCase()); return m && m.pass === String(pw || '') ? m : null; };
  const staffErr = 'שם המנהל או הסיסמה לא נכונים';
  const addName = n => {
    const name = norm(n);
    if (name.length < 2 || name.length > 30) return err('השם צריך להיות בין 2 ל-30 תווים');
    if (db.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return err(`השם "${name}" כבר ברשימה`);
    const id = ++db.seq.p;
    db.players.push({ id, name, pin: null, claimed_at: null, avatar: null, avatar_v: 0, position: Math.max(0, ...db.players.map(p => p.position)) + 1, alive: true, caught_by: null, caught_at: null, is_manager: false, blocked: false, blocked_by: null });
    return { ok: true, id, name };
  };
  const load = () => {
    if (db) { db.managers = db.managers || []; return; }
    db = store.get(KEY);
    if (db) db.managers = db.managers || [];
    if (!db) {
      db = { game: { status: 'registration', title: 'משחק התופסת', join_code: '', admin: '1234', started_at: null, finished_at: null, winner_id: null }, players: [], catches: [], managers: [], seq: { p: 0, c: 0, m: 0 } };
      ROSTER.forEach(addName);
    }
  };
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { db.catches.forEach(c => { if (c.status !== 'pending') c.photo = null; }); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e2) {} }
  };
  const checkFinish = () => {
    const al = alive(); const g = db.game;
    if (al.length === 1 && g.status === 'active') Object.assign(g, { status: 'finished', finished_at: now(), winner_id: al[0].id });
    else if (al.length > 1 && g.status === 'finished') Object.assign(g, { status: 'active', finished_at: null, winner_id: null });
  };
  const apply = (cid, by) => {
    const c = db.catches.find(x => x.id === Number(cid));
    if (!c || c.status !== 'pending') return err('הבקשה הזאת כבר טופלה');
    const a = P(c.catcher_id), b = P(c.target_id);
    if (!a.alive || !b.alive || targetOf(a.id) !== b.id) { Object.assign(c, { status: 'cancelled', resolved_by: 'system', resolved_at: now() }); return err('השרשרת השתנתה בינתיים, הבקשה בוטלה'); }
    Object.assign(b, { alive: false, caught_by: a.id, caught_at: now() });
    Object.assign(c, { status: 'confirmed', resolved_by: by, resolved_at: now() });
    db.catches.forEach(x => { if (x.status === 'pending' && (x.catcher_id === b.id || x.target_id === b.id)) Object.assign(x, { status: 'cancelled', resolved_by: 'system', resolved_at: now() }); });
    checkFinish();
    return { ok: true };
  };
  const info = () => [...db.players].sort((a, b) => a.position - b.position).map(p => ({
    id: p.id, claimed: p.pin != null, claimed_at: p.claimed_at, is_manager: p.is_manager, blocked: p.blocked, blocked_by: p.blocked_by, has_avatar: !!p.avatar, locked: false,
    rejected: db.catches.filter(c => c.catcher_id === p.id && c.status === 'rejected').length }));
  const setBlocked = (id, on, by) => {
    const p = P(id); if (!p) return;
    Object.assign(p, { blocked: !!on, blocked_by: on ? by : null });
    if (on) db.catches.forEach(c => { if (c.catcher_id === p.id && c.status === 'pending') Object.assign(c, { status: 'cancelled', resolved_by: 'blocked', resolved_at: now() }); });
  };
  const release = id => { const p = P(id); if (p) Object.assign(p, { pin: null, claimed_at: null }); };
  const setOrder = ids => {
    ids = (ids || []).map(Number);
    if (ids.length !== db.players.length || new Set(ids).size !== ids.length || ids.some(id => !P(id))) return err('הרשימה השתנתה בינתיים. רענן ונסה שוב');
    ids.forEach((id, i) => { P(id).position = i + 1; }); return { ok: true };
  };
  const clearAv = id => { const p = P(id); if (p && p.avatar) Object.assign(p, { avatar: null, avatar_v: (p.avatar_v || 0) + 1 }); };
  const F = {
    tag_state({ p_join_code }) {
      const g = db.game;
      if (!accessOk(p_join_code)) return { locked: true, game: { status: g.status, title: g.title } };
      const al = alive(); const tmap = {};
      al.forEach((p, i) => { const t = al[(i + 1) % al.length]; tmap[p.id] = t.id === p.id ? null : t.id; });
      const cnt = id => db.catches.filter(c => c.catcher_id === id && c.status === 'confirmed').length;
      return {
        game: { status: g.status, title: g.title, started_at: g.started_at, finished_at: g.finished_at, winner_id: g.winner_id },
        players: [...db.players].sort((a, b) => a.position - b.position).map(p => ({ id: p.id, name: p.name, alive: p.alive, claimed: p.pin != null, avatar_v: p.avatar ? p.avatar_v || 1 : 0, target_id: p.alive ? tmap[p.id] ?? null : null, caught_by: p.caught_by, caught_at: p.caught_at, catches: cnt(p.id) })),
        feed: db.catches.filter(c => c.status === 'confirmed').sort((a, b) => b.resolved_at.localeCompare(a.resolved_at)).slice(0, 40).map(c => ({ catcher: P(c.catcher_id)?.name, target: P(c.target_id)?.name, at: c.resolved_at })),
        server_time: now()
      };
    },
    tag_claim({ p_id, p_pin, p_join_code }) {
      if (!accessOk(p_join_code)) return err('קוד הגישה לא נכון. בקש מהמדריך את הקישור');
      const p = P(p_id); if (!p) return err('השם לא נמצא ברשימה');
      if (p.pin != null) return err('מישהו כבר נכנס עם השם הזה. אם זה השם שלך, פנה למנהל');
      if (!/^[0-9]{4}$/.test(String(p_pin || ''))) return err('הקוד האישי צריך להיות 4 ספרות');
      Object.assign(p, { pin: String(p_pin), claimed_at: now() });
      return { ok: true, id: p.id, name: p.name };
    },
    tag_login({ p_id, p_pin }) { const e = pinErr(p_id, p_pin); return e ? err(e) : { ok: true, id: Number(p_id), name: P(p_id).name }; },
    tag_me({ p_id, p_pin }) {
      const e = pinErr(p_id, p_pin); if (e) return err(e);
      const me = P(p_id); const t = me.alive ? targetOf(me.id) : null;
      const out = db.catches.filter(c => c.catcher_id === me.id && c.target_id === t && ['pending', 'rejected'].includes(c.status)).sort((a, b) => b.id - a.id)[0];
      const inc = me.blocked ? null : db.catches.filter(c => c.target_id === me.id && c.status === 'pending').sort((a, b) => b.id - a.id)[0];
      return {
        ok: true,
        me: { id: me.id, name: me.name, alive: me.alive, blocked: me.blocked, is_manager: me.is_manager, avatar_v: me.avatar ? me.avatar_v || 1 : 0, caught_at: me.caught_at, caught_by: P(me.caught_by)?.name || null, catches: db.catches.filter(c => c.catcher_id === me.id && c.status === 'confirmed').length },
        target: t ? { id: t, name: P(t).name } : null,
        outgoing: out ? { id: out.id, status: out.status, reason: out.reject_reason, resolved_by: out.resolved_by, created_at: out.created_at } : null,
        incoming: inc ? { id: inc.id, catcher: P(inc.catcher_id).name, photo: inc.photo, created_at: inc.created_at } : null
      };
    },
    tag_submit_catch({ p_id, p_pin, p_photo }) {
      const e = pinErr(p_id, p_pin); if (e) return err(e);
      const me = P(p_id);
      if (me.blocked) return err('החשבון שלך חסום. פנה למדריך');
      if (db.game.status !== 'active') return err('המשחק לא פעיל כרגע');
      if (!me.alive) return err('נתפסת, אז אתה כבר לא במשחק');
      const t = targetOf(me.id); if (!t) return err('אין לך את מי לתפוס');
      if (!isImg(p_photo)) return err('התמונה לא תקינה או גדולה מדי');
      if (db.catches.some(c => c.catcher_id === me.id && c.status === 'pending')) return err('כבר שלחת תפיסה שמחכה לאישור');
      db.catches.push({ id: ++db.seq.c, catcher_id: me.id, target_id: t, photo: p_photo, status: 'pending', reject_reason: null, resolved_by: null, created_at: now(), resolved_at: null });
      return { ok: true };
    },
    tag_self_caught({ p_id, p_pin, p_photo }) {
      const e = pinErr(p_id, p_pin); if (e) return err(e);
      const me = P(p_id);
      if (me.blocked) return err('החשבון שלך חסום. פנה למדריך');
      if (db.game.status !== 'active') return err('המשחק לא פעיל כרגע');
      if (!me.alive) return err('כבר יצאת מהמשחק');
      if (!isImg(p_photo)) return err('צריך לצרף תמונה של התפיסה');
      const h = hunterOf(me.id); if (!h) return err('אין מי שרודף אחריך');
      let c = db.catches.find(x => x.catcher_id === h && x.target_id === me.id && x.status === 'pending');
      if (c) c.photo = c.photo || p_photo;
      else {
        db.catches.forEach(x => { if (x.catcher_id === h && x.status === 'pending') Object.assign(x, { status: 'cancelled', resolved_by: 'system', resolved_at: now() }); });
        c = { id: ++db.seq.c, catcher_id: h, target_id: me.id, photo: p_photo, status: 'pending', reject_reason: null, resolved_by: null, created_at: now(), resolved_at: null };
        db.catches.push(c);
      }
      const r = apply(c.id, 'self'); if (r.error) return r;
      return { ok: true, catcher: P(h).name };
    },
    tag_cancel_catch({ p_id, p_pin }) {
      const e = pinErr(p_id, p_pin); if (e) return err(e);
      db.catches.forEach(c => { if (c.catcher_id === Number(p_id) && c.status === 'pending') Object.assign(c, { status: 'cancelled', resolved_by: 'catcher', resolved_at: now(), photo: null }); });
      return { ok: true };
    },
    tag_respond({ p_id, p_pin, p_catch_id, p_confirm, p_reason }) {
      const e = pinErr(p_id, p_pin); if (e) return err(e);
      if (P(p_id).blocked) return err('החשבון שלך חסום. פנה למדריך');
      const c = db.catches.find(x => x.id === Number(p_catch_id));
      if (!c || c.target_id !== Number(p_id)) return err('הבקשה לא נמצאה');
      if (c.status !== 'pending') return err('הבקשה הזאת כבר טופלה');
      if (p_confirm) return apply(c.id, 'target');
      Object.assign(c, { status: 'rejected', resolved_by: 'target', resolved_at: now(), reject_reason: ['tie', 'no'].includes(p_reason) ? p_reason : 'no' });
      return { ok: true };
    },
    tag_avatars({ p_join_code, p_ids }) {

{

/* profile photos: cached in this browser, fetched again only when a kid changes theirs */
const AV = store.get('tofeset.av', {}) || {};
async function syncAvatars() {
  if (!S.state || S.state.locked) return;
  const need = []; let changed = false;
  const ids = new Set();
  for (const p of S.state.players) {
    ids.add(String(p.id));
    const v = p.avatar_v || 0;
    if (!v) { if (AV[p.id]) { delete AV[p.id]; changed = true; } }
    else if (!AV[p.id] || AV[p.id].v !== v) need.push(p.id);
  }
  for (const k of Object.keys(AV)) if (!ids.has(k)) { delete AV[k]; changed = true; }
  for (let i = 0; i < need.length; i += 100) {
    const part = need.slice(i, i + 100);
    const r = await rpc('tag_avatars', { p_join_code: joinCode(), p_ids: part });
    if (r.error) break;
    part.forEach(id => { const a = r[String(id)]; if (a && isImg(a.src)) AV[id] = a; else delete AV[id]; });
    changed = true;
  }
  if (changed) store.set('tofeset.av', AV);
}
const avSrc = id => AV[id] && isImg(AV[id].src) ? AV[id].src : null;
function av(p, cls = '') {
  const src = p && avSrc(p.id);
  if (src) return `<span class="av ${cls}"><img src="${esc(src)}" alt=""></span>`;
  return `<span class="av ${cls}">${esc((p?.name || '?').trim().charAt(0))}</span>`;
}
function numCircle(p, n) {
  const src = avSrc(p.id);
  return `<span class="num ${src ? 'has-av' : ''}">${src ? `<img src="${esc(src)}" alt="">` : ''}<i>${n}</i></span>`;
}

async function refresh() {
  if (S.tab === 'admin' && S.adminCode) await refreshAdmin();
  const st = await rpc('tag_state', { p_join_code: joinCode() });
  if (st.error) { S.loadErr = st.error; } else {
    S.state = st; S.loadErr = null;
    const f = st.feed && st.feed[0]; const key = f ? f.catcher + '|' + f.target + '|' + f.at : '';
    if (S.lastFeed !== null && key && key !== S.lastFeed) S.flash = { ...f, t: Date.now() };
    if (st.feed) S.lastFeed = key;
  }
  if (S.session) {
    const me = await rpc('tag_me', { p_id: S.session.id, p_pin: S.session.pin });
    if (me.error) {
      if (!me.network && /קוד שגוי|לא נמצא|עוד לא נכנסת/.test(me.error)) { logout(); toast('צריך להיכנס מחדש', 'err'); }
    } else S.me = me;
  }
  if (S.tab === 'mod' && S.staff) await refreshMod();
  if (S.tab === 'photos' && S.state && !S.state.locked && (!S.gallery || S.galleryKey !== S.lastFeed)) await loadGallery(true);
  await syncAvatars();
  render();
}
async function refreshAdmin() {
  const a = await rpc('tag_admin_state', { p_code: S.adminCode });
  if (a.error) { if (!a.network) { S.adminCode = null; S.adminData = null; sstore.set('tofeset.admin', null); toast(a.error, 'err'); } return; }
  S.adminData = a;

}
async function refreshMod() {

}
function staffLogout() { S.staff = null; S.modData = null; store.set('tofeset.staff', null); }
function genPass() {
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789'; const a = new Uint32Array(6);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.random() * 1e9);
  return [...a].map(n => abc[n % abc.length]).join('');
}
async function loadGallery(fresh) {
  const before = !fresh && S.gallery && S.gallery.items.length ? S.gallery.items[S.gallery.items.length - 1].id : null;
  const r = await rpc('tag_gallery', { p_join_code: joinCode(), p_before_id: before, p_limit: 8 });

function setHTML(el, html) {
  if (el._html === html) return;
  const saved = {};
  el.querySelectorAll('input[id],select[id],textarea[id]').forEach(i => { if (i.type !== 'file') saved[i.id] = i.value; });
  const opened = [...el.querySelectorAll('details[id]')].filter(d => d.open).map(d => d.id);
  const a = document.activeElement; let fid = null, s1, s2;
  if (a && a.id && el.contains(a)) { fid = a.id; try { s1 = a.selectionStart; s2 = a.selectionEnd; } catch (e) {} }
  el.innerHTML = html; el._html = html;
  for (const id in saved) { const i = document.getElementById(id); if (i && el.contains(i)) i.value = saved[id]; }
  opened.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  if (fid) { const f = document.getElementById(fid); if (f) { f.focus({ preventScroll: true }); try { f.setSelectionRange(s1, s2); } catch (e) {} } }
}

      <h1 class="gold-text">${esc(S.state.game.title)}</h1>
      <p class="muted">כדי להיכנס צריך את הקישור מהמדריך, או את קוד הגישה.</p></section>
    <section class="card"><form data-form="access" autocomplete="off"><label>קוד גישה<input id="x-code" autocomplete="off"></label>
      <button class="btn gold xl" type="submit">המשך</button></form></section>
    <div class="foot"><a class="link" href="#mod">כניסת מנהלים</a> · <a class="link" href="#admin">מנהל ראשי</a></div>`;
}

function winnerCard() {
  const { game: g, players: ps } = S.state;
  const w = ps.find(p => p.id === g.winner_id);
  if (!w) return '';
  const isMe = S.session && S.session.id === w.id;
  return `<section class="card winner"><div class="crown">🏆</div><div class="label">${isMe ? 'ניצחת!!!' : 'המנצח/ת'}</div>
    <div class="winner-name">${esc(w.name)}</div><p class="muted">${w.catches} תפיסות במשחק</p></section>`;
}

function meView() {
  const g = S.state.game, ps = S.state.players;
  if (!S.session) return authView();
  const m = S.me;
  if (!m) return '<div class="skeleton"></div>';
  const me = m.me;
  const idx = ps.findIndex(p => p.id === me.id);
  const hunter = ps.find(p => p.alive && p.target_id === me.id);
  let h = `<div class="hello"><button class="me-av" data-act="profile">${av(me)}<span>היי, <b>${esc(me.name)}</b></span></button><button class="link" data-act="profile">✏️ הפרופיל שלי</button></div>`;
  if (me.blocked) {
    return h + `<section class="card out"><div class="big-emoji">🚫</div><h2>החשבון שלך חסום</h2>
      <p class="muted">אחד המנהלים חסם את החשבון. אם זו טעות, פנה למדריך.</p></section>`;
  }
  if (m.incoming) h += incomingCard(m.incoming);
  if (g.status === 'finished') h += winnerCard();
  if (g.status === 'registration') {
    h += `<section class="card center"><div class="big-emoji">✅</div><h2>אתה ברשימה!</h2>
      <p>אתה מספר <b class="gold">${idx + 1}</b> מתוך ${ps.length}. המשחק יתחיל כשהמדריך יפתח אותו.</p>
      ${m.target ? `<p class="muted small">כשהמשחק יתחיל, תצטרך לתפוס את <b class="gold">${esc(m.target.name)}</b>.</p>` : ''}</section>`;
  } else if (me.alive && g.status === 'active') {
    h += targetCard(m);
  } else if (!me.alive) {
    h += `<section class="card out"><div class="big-emoji">😅</div><h2>נתפסת!</h2>
      <p><b class="gold">${esc(me.caught_by || 'מישהו')}</b> תפס/ה אותך ${ago(me.caught_at)}.</p>
      <p class="muted small">אתה כבר לא במשחק, אבל אפשר להמשיך לעקוב בשרשרת 🔗</p></section>`;
  }
  h += `<section class="stats-row">
    <div class="stat"><div class="n">${me.catches}</div><div class="l">תפסת</div></div>
    <div class="stat"><div class="n">${idx + 1}</div><div class="l">מספר ברשימה</div></div>
    <div class="stat"><div class="n">${ps.filter(p => p.alive).length}</div><div class="l">נשארו במשחק</div></div></section>`;
  if (me.alive && hunter && g.status === 'active' && !m.incoming)
    h += `<section class="card self-card"><h3>🙋 כבר נתפסת?</h3>
      <p class="muted small">אם ${esc(hunter.name)} תפס/ה אותך (גם לפני שהיה את האתר), מעלים את התמונה של התפיסה ויוצאים מהמשחק.</p>
      <button class="btn" data-act="self-caught">🙋 נתפסתי, העלאת תמונה</button></section>`;
  if (me.alive && hunter && g.status === 'active')
    h += `<section class="card hunter">👀 מי רודף אחריך? ${avSrc(hunter.id) ? av(hunter) : ''} <b class="gold">${esc(hunter.name)}</b>
      <div class="muted small">עם עניבת צופים 🧣 אי אפשר לתפוס אותך</div></section>`;
  return h;
}

function targetCard(m) {
  const t = m.target;
  if (!t) return `<section class="card center"><h2>אין לך את מי לתפוס</h2></section>`;
  const o = m.outgoing;
  let notice = '';
  if (o && o.status === 'rejected') {
    const why = o.resolved_by === 'admin' ? 'המדריך דחה את התפיסה האחרונה.'
      : o.reason === 'tie' ? `התפיסה נדחתה: לפי ${esc(t.name)} הייתה עניבת צופים 🧣`
      : `התפיסה נדחתה: לפי ${esc(t.name)} לא הייתה תפיסה.`;
    notice = `<div class="notice warn">${why} אפשר לנסות שוב. במחלוקת, המדריך מכריע.</div>`;
  }
  const pending = o && o.status === 'pending';
  return `<section class="card target"><div class="label">🎯 המטרה שלך</div>
    ${avSrc(t.id) ? `<div class="target-av">${av(t, 'lg')}</div>` : ''}
    <div class="target-name">${esc(t.name)}</div>${notice}
    ${pending
      ? `<div class="pending"><div class="spinner"></div><div><b>מחכים לאישור של ${esc(t.name)}</b><div class="muted small">שלחת תמונה ${ago(o.created_at)}</div></div></div>
         <button class="btn ghost small" data-act="cancel-catch">ביטול ושליחת תמונה אחרת</button>`
      : `<button class="btn gold xl" data-act="catch">📸 תפסתי! צלם הוכחה</button>
         <button class="link-btn" data-act="catch-gallery">📁 כבר יש לך תמונה? העלאה מהגלריה</button>
         <div class="tie-hint">🧣 את מי שחובש עניבת צופים אי אפשר לתפוס. בתמונה צריך לראות שאין עניבה</div>`}
  </section>`;
}

function incomingCard(i) {
  return `<section class="card incoming"><div class="label">📸 תפיסה חדשה!</div>
    <h2><b class="gold">${esc(i.catcher)}</b> אומר/ת שתפס/ה אותך</h2>
    ${isImg(i.photo) ? `<img class="proof" src="${esc(i.photo)}" data-act="zoom" alt="תמונת ההוכחה">` : ''}
    <p class="muted small">אם היית עם עניבת צופים, אי אפשר לתפוס אותך 🧣</p>
    <div class="btn-col">
      <button class="btn gold" data-act="respond" data-id="${i.id}" data-v="yes">כן, נתפסתי</button>
      <button class="btn" data-act="respond" data-id="${i.id}" data-v="tie">🧣 הייתי עם עניבה</button>
      <button class="btn ghost" data-act="respond" data-id="${i.id}" data-v="no">לא תפסו אותי</button>
    </div></section>`;
}

function authView() {
  const g = S.state.game;
  const names = [...S.state.players].sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const sel = S.state.players.find(p => p.id === Number(S.loginId));
  const sub = g.status === 'registration' ? 'בוחרים את השם שלך ונכנסים. המשחק יתחיל בקרוב!'
    : g.status === 'active' ? 'המשחק רץ! בוחרים את השם שלך ונכנסים' : 'המשחק נגמר. אפשר להיכנס ולראות איך הלך';
  const norm = t => String(t || '').replace(/["'״׳\s]/g, '');
  const q = norm(S.loginQ);
  const shown = q ? names.filter(p => norm(p.name).includes(q)) : names;
  let form;
  if (!sel) {
    form = `<label for="l-q">מי אתה?</label>
      <input id="l-q" type="search" placeholder="🔍 חיפוש השם שלך…" autocomplete="off" enterkeyhint="search">
      <div class="name-grid">${shown.map(p => `<button type="button" class="name-btn" data-act="pick" data-id="${p.id}">${avSrc(p.id) ? av(p) : ''}${esc(p.name)}</button>`).join('')}</div>
      ${shown.length ? '' : '<p class="empty">לא מצאתי את השם הזה</p>'}
      <p class="muted small">לא מוצא את השם שלך? פנה למדריך.</p>`;
  } else {
    form = `<form data-form="${sel.claimed ? 'login' : 'claim'}" autocomplete="off">
      <div class="picked">${av(sel)}<b>${esc(sel.name)}</b><button type="button" class="link" data-act="unpick">זה לא אני</button></div>`;
    if (!sel.claimed) form += `<div class="notice ok">👋 פעם ראשונה? בחר קוד אישי בן 4 ספרות. איתו תיכנס מעכשיו.</div>
      <div class="row2"><label>קוד אישי חדש<input id="c-pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label>
      <label>שוב את הקוד<input id="c-pin2" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label></div>
      <p class="muted small">🔒 שומרים את הקוד בסוד. מי שיודע אותו יכול להיכנס בשמך.</p>
      <button class="btn gold xl" type="submit">אני ${esc(sel.name)}, כניסה</button>`;
    else form += `<label>הקוד האישי שלך<input id="l-pin" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"></label>
      <button class="btn gold xl" type="submit">כניסה</button>
      <p class="muted small center">שכחת את הקוד? מנהל או מדריך יכולים לשחרר את השם שלך, ואז בוחרים קוד חדש.</p>`;
    form += '</form>';
  }
  return `<section class="card center"><div class="welcome-logo">${LOGO}</div>
      <h1 class="gold-text">${esc(g.title)}</h1><p class="muted">${sub}</p></section>
    ${g.status === 'finished' ? winnerCard() : ''}
    <section class="card">${names.length ? form : '<p class="empty">הרשימה עוד ריקה</p>'}</section>
    <div class="foot"><a class="link" href="#mod">כניסת מנהלים</a> · <a class="link" href="#admin">מנהל ראשי</a></div>`;
}

function chainView() {
  const { players: ps, feed, game: g } = S.state;
  const meId = S.session?.id;
  const byId = Object.fromEntries(ps.map(p => [p.id, p]));
  const q = S.search.trim();
  const rows = ps.map((p, i) => ({ ...p, n: i + 1 }))
    .filter(p => (S.filter === 'all' || p.alive) && (!q || p.name.includes(q)));
  const top = ps.filter(p => p.catches > 0).sort((a, b) => b.catches - a.catches).slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  const podium = top.length ? `<section class="card"><h3>🏅 מלכי התפיסות</h3><div class="podium">
      ${[1, 0, 2].filter(i => top[i]).map(i => `<div class="${i === 0 ? 'p1' : ''}"><div class="m">${medals[i]}</div>${avSrc(top[i].id) ? av(top[i], 'md') : ''}<div class="pn">${esc(top[i].name)}</div><div class="pc">${top[i].catches} תפיסות</div></div>`).join('')}
    </div></section>` : '';
  const fd = feed.length ? `<section class="card"><h3>⚡ מה קרה לאחרונה</h3><ul class="feed">
      ${feed.slice(0, 6).map(f => `<li><span><b>${esc(f.catcher)}</b> תפס/ה את <b>${esc(f.target)}</b></span><span class="t">${ago(f.at)}</span></li>`).join('')}</ul></section>` : '';
  const list = rows.length ? `<ul class="chain">${rows.map(p => {
      const sub = p.alive
        ? (p.target_id ? `🎯 תופס/ת את <b>${esc(byId[p.target_id]?.name)}</b>` : (g.status === 'finished' ? '🏆 ניצח/ה!' : ''))
        : `נתפס/ה ע״י ${esc(byId[p.caught_by]?.name || '—')}`;
      return `<li class="node ${p.alive ? 'alive' : 'out'} ${p.id === meId ? 'me' : ''}">${numCircle(p, p.n)}
        <div class="who"><div class="nm">${esc(p.name)}${p.id === meId ? ' <span class="you">(אני)</span>' : ''}</div><div class="sub">${sub}</div></div>
        ${p.catches ? `<span class="badge">🏅 ${p.catches}</span>` : ''}</li>`;
    }).join('')}</ul>${!q && S.filter === 'all' && ps.length > 1 ? '<div class="loop">↺ האחרון ברשימה תופס את הראשון</div>' : ''}`
    : `<p class="empty">${ps.length ? 'לא נמצאו ילדים' : 'הרשימה עוד ריקה'}</p>`;
  return `${podium}${fd}<section class="card"><h3>🔗 השרשרת <a class="live-link" href="#live">📺 מסך חי</a></h3>
    <div class="tools"><input id="c-search" type="search" placeholder="חיפוש שם…" autocomplete="off">
      <div class="chips"><button class="${S.filter === 'all' ? 'on' : ''}" data-act="filter" data-f="all">כולם</button><button class="${S.filter === 'alive' ? 'on' : ''}" data-act="filter" data-f="alive">במשחק</button></div></div>
    ${list}</section>`;
}

function liveView() {
  const { players: ps, feed, game: g } = S.state;
  const byId = Object.fromEntries(ps.map(p => [p.id, p]));
  const alive = ps.filter(p => p.alive);
  const top = ps.filter(p => p.catches > 0).sort((a, b) => b.catches - a.catches).slice(0, 5);
  const pairs = ps.filter(p => p.alive && p.target_id);
  const flash = S.flash && Date.now() - S.flash.t < 9000 ? S.flash : null;
  const medals = ['🥇', '🥈', '🥉', '4', '5'];
  return `<div class="live-head"><h2 style="margin:0">📺 <span class="gold-text">${esc(g.title)} · בשידור חי</span></h2><div><a class="live-link" href="#photos" style="float:none">📸 תמונות</a> <a class="link" href="#chain">יציאה</a></div></div>
    ${flash ? `<div class="live-flash">⚡ <b>${esc(flash.catcher)}</b> תפס/ה את <b>${esc(flash.target)}</b>!</div>` : ''}
    <div class="live-top">
      <div class="live-stat"><div class="n">${alive.length}</div><div class="l">עדיין במשחק</div></div>
      <div class="live-stat"><div class="n">${ps.length - alive.length}</div><div class="l">נתפסו</div></div>
      <div class="live-stat"><div class="n">${ps.length}</div><div class="l">ברשימה</div></div>
    </div>
    ${g.status === 'finished' ? winnerCard() : g.status === 'registration' ? '<section class="card center"><h2>המשחק עוד לא התחיל</h2><p class="muted">ברגע שהמנהל הראשי יתחיל, הכול יופיע כאן</p></section>' : ''}
    <div class="live-grid">
      <section class="card"><h3>🏅 מלכי התפיסות</h3>${top.length ? top.map((p, i) => `<div class="lb-row"><span>${medals[i]}</span>${av(p)}<b>${esc(p.name)}</b><span class="c">${p.catches}</span></div>`).join('') : '<p class="empty">עוד אין תפיסות</p>'}</section>
      <section class="card"><h3>⚡ תפיסות אחרונות</h3>${feed.length ? `<ul class="feed live-feed">${feed.slice(0, 8).map(f => `<li><span><b>${esc(f.catcher)}</b> תפס/ה את <b>${esc(f.target)}</b></span><span class="t">${ago(f.at)}</span></li>`).join('')}</ul>` : '<p class="empty">עוד אין תפיסות</p>'}</section>
      ${g.status !== 'finished' && pairs.length ? `<section class="card live-pairs"><h3>🎯 מי רודף אחרי מי (${pairs.length})</h3><div class="pairs">
        ${pairs.map(p => `<div class="pair">${av(p)}<b>${esc(p.name)}</b><span class="arrow">←</span>${av(byId[p.target_id])}<span>${esc(byId[p.target_id]?.name)}</span></div>`).join('')}</div></section>` : ''}
    </div>`;
}

function galleryView() {
  const G = S.gallery;
  if (!G) return '<div class="skeleton"></div>';
  const canDel = !!(S.staff || S.adminCode);
  if (!G.items.length) return `<section class="card center"><div class="big-emoji">📸</div><h2>עוד אין תמונות</h2><p class="muted">כאן יופיעו התמונות של כל התפיסות שאושרו.</p></section>`;
  return `<section class="card"><h3>📸 תמונות התפיסות</h3><p class="muted small">כל תפיסה שאושרה, עם התמונה. לוחצים על תמונה כדי להגדיל.</p>
    <div class="gallery">${G.items.map(x => `<div class="gitem">
      <img src="${esc(x.photo)}" alt="${esc(x.catcher)} תפס את ${esc(x.target)}" data-act="zoom" loading="lazy">
      ${canDel ? `<button class="del" data-act="photo-del" data-id="${x.id}" title="מחיקת התמונה">🗑️</button>` : ''}
      <div class="cap"><b>${esc(x.catcher)}</b> תפס/ה את <b>${esc(x.target)}</b><div class="t">${ago(x.at)}</div></div></div>`).join('')}</div>
    ${G.done ? '' : '<button class="btn small" data-act="gallery-more">עוד תמונות</button>'}</section>`;
}

function rulesView() {
  return `<section class="card center"><h1 class="gold-text">🔥 תופסת שכבגית</h1>
      <p>המשחק נמשך עד שנשאר אחד אחרון, והוא המנצח! 🏆</p></section>
    <section class="card"><h3>🎯 איך משחקים</h3><ol class="rules">
      <li>כל אחד צריך לתפוס את מי שנמצא אחריו ברשימה, ולדאוג שלא ייתפס על ידי מי שלפניו.</li>
      <li>מי שנתפס נמחק מהרשימה, ומי שתפס אותו ממשיך לתפוס את מי שאחריו.</li>
      <li>האחרון ברשימה תופס את הראשון.</li>
      <li>תפסת? מצלמים את התפיסה דרך האתר (או מעלים תמונה מהגלריה), ומי שנתפס מאשר. בלי צילום, התפיסה לא נחשבת.</li>
      <li>נתפסת והתפיסה לא נרשמה באתר? לוחצים <b>🙋 נתפסתי</b>, מעלים את התמונה, ויוצאים מהמשחק.</li>
      <li>הרשימה באתר מתעדכנת לבד אחרי כל תפיסה. כל אחד אחראי להתעדכן מי המטרה שלו.</li>
    </ol></section>
    <section class="card"><h3>💡 דוגמה</h3>
      <p class="gold" style="font-weight:700;font-size:17px">מאור ← רעות ← אור ← אלעד ← גפן</p>
      <p>אור צריך לתפוס את אלעד ולהיזהר מרעות. אם אור תפס את אלעד, אלעד נמחק מהרשימה, ועכשיו התור של אור לתפוס את גפן.</p>
      <p>גפן, האחרון ברשימה, תופס את מאור, הראשון.</p></section>
    <section class="card tie-rule"><div class="ico">🧣</div><div><h2 class="gold-text">חוק העניבה</h2>
      <p>מי שחובש את עניבת הצופים, <b>אי אפשר לתפוס אותו!</b></p></div></section>
    <section class="card"><h3>📍 איפה מותר לתפוס</h3>
      <p>בכל מקום, <b>חוץ מהשבט, בית הספר ואירועים שכבגיים</b>.</p>
      <p>מותר לעקוב אחרי אנשים ברחוב, בעבודה, באוטו וכו׳, הכול כדי לתפוס את מי שאתם צריכים. להיכנס לבית מותר רק באישור של אחד מבני המשפחה.</p></section>
    <section class="card"><h3>❌ אסור</h3><ol class="rules">
      <li>להשתמש באלימות או להשחית רכוש. תפיסה עם אלימות נפסלת.</li>
      <li>לדחוף הורים, בני משפחה או אנשים שלא קשורים למשחק.</li>
      <li>להתקשר לבני משפחה של מי שאתם תופסים אחרי 23:00 בלילה. לכתוב מותר.</li>
      <li>לקפוץ למכונית או לריינג׳ר נוסעים. התפיסה לא תיחשב.</li>
      <li>להיכנס לבית בלי אישור של אחד מבני המשפחה. התפיסה תיפסל.</li>

let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-handle]'); if (!h) return;
  e.preventDefault();
  drag = { row: h.closest('.ro-row') }; drag.row.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) {}
});
document.addEventListener('pointermove', e => {
  if (!drag) return; e.preventDefault();
  const list = document.getElementById('ro-list'); if (!list) return;
  let before = null;
  for (const r of list.querySelectorAll('.ro-row')) {
    if (r === drag.row) continue;
    const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; }
  }
  if (before) { if (drag.row.nextSibling !== before) list.insertBefore(drag.row, before); } else if (list.lastElementChild !== drag.row) list.appendChild(drag.row);
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 120) window.scrollBy(0, 14);
}, { passive: false });
function endDrag() {
  if (!drag) return;
  drag.row.classList.remove('dragging');
  const list = document.getElementById('ro-list');
  if (list && S.reorder) S.reorder.ids = [...list.querySelectorAll('.ro-row')].map(r => Number(r.dataset.id));
  drag = null; render();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

  return new Promise(res => {
    const sheet = openModal(`<h3>${title}</h3>${text ? `<p class="muted">${text}</p>` : ''}
      ${input ? `<input id="m-input" ${input}>` : ''}
      <div class="btn-row"><button class="btn ${danger ? 'danger' : 'gold'}" data-m="ok">${ok}</button><button class="btn ghost" data-m="cancel">${cancel}</button></div>`);

/* ---------------------------------------------------------------- camera */
function compressImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
async function onCatchFile(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let data;
  try { data = await compressImage(f, LIVE ? 1000 : 640, LIVE ? 0.72 : 0.6); }
  catch (err) { toast('לא הצלחתי לקרוא את התמונה', 'err'); return; }
  const t = S.me?.target?.name || '';
  const sheet = openModal(`<h3>📸 זו ההוכחה?</h3><img class="proof" src="${data}" alt="">
    <p class="muted small">צריך לראות בתמונה את ${esc(t)}, ושאין עניבת צופים 🧣</p>
    <div class="btn-row"><button class="btn gold" data-m="send">שליחה ל${esc(t)} לאישור</button><button class="btn ghost" data-m="again">צילום מחדש</button></div>`);
  sheet.parentElement.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-m]');
    if (ev.target === sheet.parentElement) { closeModal(); return; }
    if (!b) return;
    if (b.dataset.m === 'again') { closeModal(); $('#cam').value = ''; $('#cam').click(); return; }
    b.classList.add('busy'); b.disabled = true;
    const r = await rpc('tag_submit_catch', { p_id: S.session.id, p_pin: S.session.pin, p_photo: data });
    closeModal();
    if (r.error) toast(r.error, 'err'); else toast(`נשלח! מחכים ש${t} יאשר`, 'ok');
    refresh();
  });
}

/* ---------------------------------------------------------------- profile */
function squareAvatar(file, size = 180) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      const sx = (w - s) / 2, sy = h > w ? (h - s) * 0.3 : 0;
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      let q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > 55000 && q > 0.35) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

async function busy(btn, fn) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  try { return await fn(); } finally { if (btn && btn.isConnected) { btn.classList.remove('busy'); btn.disabled = false; } }
}

async function done(r, okMsg) {

async function personActions(kind, id) {
  const p = S.state.players.find(x => x.id === id); if (!p) return;
  const data = kind === 'admin' ? S.adminData : S.modData;
  const inf = (data?.info || []).find(i => i.id === id) || {};
  const isAdmin = kind === 'admin';
  const canTouch = true;
  const opts = [];
  if (canTouch) opts.push(inf.blocked ? ['unblock', '✅ ביטול חסימה'] : ['block', '🚫 חסימה (ספאם)', 'danger']);
  if (canTouch && inf.claimed) opts.push(['release', '🔓 שחרור השם (ייכנס שוב עם קוד חדש)']);
  if (inf.has_avatar) opts.push(['clearav', '🖼️ מחיקת התמונה']);
  if (isAdmin) opts.push(['rename', '✏️ שינוי השם']);
  if (isAdmin) {
    if (!p.alive) opts.push(['revive', '↩️ החזרה למשחק']);
    opts.push(['remove', '🗑️ מחיקה מהרשימה', 'danger']);
  }
  if (!opts.length) { toast('אין פעולות זמינות', 'err'); return; }
  const status = [inf.claimed ? 'נכנס/ה לאתר' : 'עוד לא נכנס/ה', inf.blocked ? '🚫 חסום' : '', inf.rejected ? `${inf.rejected} תפיסות נדחו` : ''].filter(Boolean).join(' · ');
  const k = await choose(esc(p.name), status, opts);
  if (!k) return;
  const n = esc(p.name);
  if (k === 'block' || k === 'unblock') {
    const on = k === 'block';
    if (on && !(await ask({ title: `לחסום את ${n}?`, text: 'הוא/היא לא יוכל/תוכל לשלוח תפיסות או לאשר. תפיסה שמחכה תבוטל. אפשר לבטל את החסימה מתי שרוצים.', ok: 'חסימה', danger: true }))) return;
    return done(isAdmin ? await adm('tag_admin_block', { p_player_id: id, p_on: on }) : await mod('tag_staff_block', { p_player_id: id, p_on: on }), on ? `${p.name} נחסם/ה` : 'החסימה בוטלה');
  }
  if (k === 'release') {
    if (!(await ask({ title: `לשחרר את השם ${n}?`, text: 'מי שנכנס עם השם הזה ייצא. הילד/ה האמיתי/ת ייכנס/תיכנס שוב ויבחר/תבחר קוד חדש.', ok: 'שחרור' }))) return;
    return done(isAdmin ? await adm('tag_admin_release', { p_player_id: id }) : await mod('tag_staff_release', { p_player_id: id }), 'השם שוחרר');
  }
  if (k === 'clearav') {
    if (!(await ask({ title: `למחוק את התמונה של ${n}?`, ok: 'מחיקה', danger: true }))) return;
    return done(isAdmin ? await adm('tag_admin_clear_avatar', { p_player_id: id }) : await mod('tag_staff_clear_avatar', { p_player_id: id }), 'התמונה נמחקה');
  }
  if (k === 'rename') {
    const nn = await ask({ title: `שם חדש ל${n}`, ok: 'שמירה', input: `maxlength="30" autocomplete="off" value="${n}"` });
    if (nn == null) return;
    return done(await adm('tag_admin_rename', { p_player_id: id, p_name: nn }), 'השם עודכן');
  }
  if (k === 'manager' || k === 'unmanager') return done(await adm('tag_admin_set_manager', { p_player_id: id, p_on: k === 'manager' }), k === 'manager' ? `${p.name} מנהל/ת עכשיו ⭐` : 'ההרשאה הוסרה');
  if (k === 'revive') return done(await adm('tag_admin_revive', { p_player_id: id }), 'הוחזר/ה למשחק');
  if (k === 'remove') {
    if (!(await ask({ title: `למחוק את ${n}?`, text: 'הילד/ה יוצא/ת מהרשימה לגמרי.', ok: 'מחיקה', danger: true }))) return;
    return done(await adm('tag_admin_remove_player', { p_player_id: id }), 'נמחק/ה');
  }
}

    const code = val('a-code');
    const r = await rpc('tag_admin_state', { p_code: code });
    if (r.error) { toast(r.error, 'err'); return; }
    S.adminCode = code; S.adminData = r; sstore.set('tofeset.admin', code);
    if (r.join_code) store.set('tofeset.join', r.join_code);
    await refresh();
  },
  async 'a-add'() {
    const ok = await done(await adm('tag_admin_add_player', { p_name: val('a-name') }), 'נוסף/ה לסוף הרשימה');
    if (ok) { const i = document.getElementById('a-name'); if (i) i.value = ''; }
  },
  async 'a-bulk'() {
    const r = await adm('tag_admin_add_players', { p_names: document.getElementById('a-bulk')?.value || '' });
    if (r.error) { toast(r.error, 'err'); return; }
    toast(`נוספו ${r.added} שמות` + (r.skipped.length ? `. דילגתי על: ${r.skipped.join(', ')}` : ''), 'ok');
    const t = document.getElementById('a-bulk'); if (t) t.value = '';
    await refresh();
  },
  async 'a-settings'() {
    const ok = await done(await adm('tag_admin_settings', { p_title: val('s-title'), p_join_code: val('s-join') }), 'נשמר');
    if (ok) store.set('tofeset.join', val('s-join') || null);
  },
  async 'a-code'() {
    const nc = val('s-newcode');
    const r = await adm('tag_admin_set_code', { p_new_code: nc });
    if (r.error) { toast(r.error, 'err'); return; }
    S.adminCode = nc; sstore.set('tofeset.admin', nc); document.getElementById('s-newcode').value = ''; toast('קוד המדריך הוחלף', 'ok');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('#modal-root')) return;
  e.preventDefault();
  ACT[el.dataset.act]?.(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('button[type=submit]');
  busy(btn, () => FORMS[f.dataset.form]?.(f, btn));
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'c-search') { S.search = e.target.value; render(); }
  if (id === 'a-search') { S.aSearch = e.target.value; render(); }
  if (id === 'm-search') { S.mSearch = e.target.value; render(); }
  if (id === 'l-q') { S.loginQ = e.target.value; render(); }
  if (e.target.classList.contains('pin')) e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
});
document.addEventListener('change', e => {
  if (e.target.id === 'l-id') { S.loginId = e.target.value; render(); }
});

/* ---------------------------------------------------------------- routing + polling */
function route() {
  const h = (location.hash || '').replace('#', '');
  S.tab = ['me', 'chain', 'rules', 'admin', 'mod', 'live', 'photos'].includes(h) ? h : 'me';
  window.scrollTo(0, 0);
  render();
  if ((S.tab === 'admin' && S.adminCode) || S.tab === 'mod') refresh();
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
setInterval(() => { if (document.visibilityState === 'visible' && !$('#modal-root').innerHTML) refresh(); }, LIVE ? 7000 : 2500);
route();
refresh();
})();
</script>
</body>
</html>
